[project]
name = "codechallenge-snake-bot"
version = "1.0.0"
description = "A Code Challenge Snake bot that plays not to lose."
requires-python = ">=3.10"
dependencies = ["websockets>=12.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["snakebot"]
